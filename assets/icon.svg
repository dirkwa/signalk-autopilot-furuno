<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Furuno NavPilot autopilot</title>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b6aa8"/>
      <stop offset="1" stop-color="#0a2f52"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#sea)"/>

  <!-- route from the helm to the next waypoint -->
  <path d="M70 58 L92 36" fill="none" stroke="#ffb020" stroke-width="6" stroke-linecap="round" stroke-dasharray="0.1 10.8"/>
  <circle cx="101" cy="27" r="10" fill="none" stroke="#ffb020" stroke-width="5.5"/>
  <circle cx="101" cy="27" r="3" fill="#ffb020"/>

  <!-- ship's wheel, turned a little as if steering -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="48" cy="80" r="24" stroke-width="7"/>
    <g stroke-width="6" transform="rotate(22.5 48 80)">
      <path d="M48 42 V118"/>
      <path d="M10 80 H86"/>
      <path d="M21.1 53.1 L74.9 106.9"/>
      <path d="M74.9 53.1 L21.1 106.9"/>
    </g>
  </g>
  <circle cx="48" cy="80" r="9" fill="#ffffff"/>
  <circle cx="48" cy="80" r="3.5" fill="#0a2f52"/>
</svg>
