name: SignalK Plugin CI

# SignalK's reusable plugin CI: tests on Linux x64/arm64, macOS and Windows
# with Node 22 and 24, on armv7 (Cerbo GX) under QEMU, and installs the plugin
# into a running Signal K server. The plugin registry reads the result of the
# runs on main for the plugin's score.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit on a pull request supersedes its running check. Every other
# run gets a group of its own: a group holds only one pending run, so pushes to
# main landing close together would otherwise replace each other's waiting run
# and leave a commit without a result, and main runs are what the registry
# reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-ci:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      enable-signalk-integration: true
