name: Publish Package

# Publishes the tag it runs on to npm. Release tags come from release-please:
# merging its release PR creates the tag and the GitHub release, then
# dispatches this workflow on the tag. Pre-release tags (-beta.N / -rc.N) are
# pushed by hand and start it through the tag trigger.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # A dispatch can name any ref; only a release tag is published.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clean workspace
        run: git clean -xfd

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # actions/setup-node ships Node 22 with npm 10.9.x, which has no OIDC
      # support: `npm publish` silently falls through to legacy auth even when
      # GitHub issues a valid OIDC token, and the registry rejects the
      # unauthenticated PUT as a misleading 404. The handshake landed in npm
      # 11.5.
      #
      # Pin the MAJOR. An earlier version of this workflow used `npm@latest`,
      # which now resolves to npm 12 and breaks `--provenance` with
      # "Cannot find module 'sigstore'". Removing the upgrade entirely (the
      # first attempt at fixing that) is what reintroduced npm 10.9.x here.
      # `npm@^11` is the version window where both provenance and OIDC work.
      - name: Upgrade npm to ≥ 11.5 for OIDC trusted publishing
        run: npm install -g npm@^11

      - run: npm --version

      - run: npm install

      - run: npm test

      - name: Publish
        run: | 
          if [[ "${{ github.ref }}" == refs/tags/*-beta.* ]] || [[ "${{ github.ref }}" == refs/tags/*-rc.* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi